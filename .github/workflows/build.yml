name: Build for Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@v1.1

      - name: Setup MSVC Compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download Prebuilt Skia
        shell: pwsh
        run: |
          $url = "https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile "skia.zip" -UserAgent "Mozilla/5.0"
          Expand-Archive -Path "skia.zip" -DestinationPath "skia" -Force
      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -G Ninja .. `
            -DCMAKE_BUILD_TYPE=Release `
            -DLAF_BACKEND=skia `
            -DSKIA_DIR=${{ github.workspace }}/skia `
            -DSKIA_LIBRARY_DIR=${{ github.workspace }}/skia/out/Release-x64 `
            -DSKIA_LIBRARY=${{ github.workspace }}/skia/out/Release-x64/skia.lib

      - name: Compile Aseprite
        run: |
          cd build
          ninja aseprite

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows-x64
          path: build/bin/
